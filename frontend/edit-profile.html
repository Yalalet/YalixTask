<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Редактировать профиль — Yalix</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-requires-auth="true">
  <div class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="Yalix logo">
        <a href="index.html" class="brand-link"><span class="brand-mark">Y</span><span class="brand-text">Yalix</span></a>
      </div>
      <div class="auth-actions">
        <a href="personal-cabinet.html" class="auth-btn login-btn">Назад</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="container">
        <h1>Редактировать профиль</h1>
        <form id="editProfileForm" class="task-form">
          <div class="field">
            <label for="firstName">Имя</label>
            <input id="firstName" type="text" placeholder="Имя" required />
          </div>

          <div class="field">
            <label for="lastName">Фамилия</label>
            <input id="lastName" type="text" placeholder="Фамилия" required />
          </div>

          <div class="field">
            <label for="login">Логин</label>
            <input id="login" type="text" placeholder="Логин" required minlength="3" />
          </div>

          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" placeholder="email@example.com" required />
          </div>

          <div class="auth-actions-inline">
            <button type="submit" class="edit-btn">Сохранить</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer-bar">
      <span>Поддержка: <a href="mailto:YalixHelp@gmail.com">YalixHelp@gmail.com</a></span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/edit-profile.js"></script>
</body>
</html>
