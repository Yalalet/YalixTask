<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход — Yalix</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="Yalix logo">
        <a href="index.html" class="brand-link"><span class="brand-mark">Y</span><span class="brand-text">Yalix</span></a>
      </div>

      <div class="auth-actions">
        <a class="auth-btn signup-btn" href="register.html">Создать аккаунт</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="container">
        <h1>Вход</h1>

        <form id="loginForm" class="task-form">
          <div class="field">
            <label for="loginIdentifier">Логин</label>
            <input id="loginIdentifier" type="text" placeholder="Логин" required />
          </div>

          <div class="field">
            <label for="loginPassword">Пароль</label>
            <input id="loginPassword" type="password" placeholder="Пароль" required />
          </div>

          <div class="auth-inline-row">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" /> Запомнить меня
            </label>
            <div>
              <a href="register.html" class="auth-link">Нет аккаунта?</a>
            </div>
          </div>

          <div class="auth-actions-inline">
            <button type="submit" class="edit-btn">Войти</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer-bar">
      <span>Поддержка: <a href="mailto:YalixHelp@gmail.com">YalixHelp@gmail.com</a></span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
